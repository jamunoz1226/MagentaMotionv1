 [build]
   command = "npm run build"
   publish = "dist"

  [build.environment]
    NODE_VERSION = "20"

 [[redirects]]
   from = "/*"
   to = "/index.html"
   status = 200

 # (Optional) Cache immutable assets safely
 [[headers]]
   for = "/assets/*"
   [headers.values]
     cache-control = "public, max-age=31536000, immutable"
